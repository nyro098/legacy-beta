<style>
/* Layout: sticky broadcast-style top bar, one 1120px column, match posters (diagonal split + VS) are the single bold element; everything else stays quiet. Dark-first. */
:root{
  --bg:#0b0f12; --bg-2:#10161a; --surface:#151c21; --surface-2:#1b242a; --line:#26323a;
  --fg:#e9eef0; --fg-2:#9aa9b0;
  --accent:#f0b429; --accent-ink:#1a1203; --accent-text:#f0b429;
  --win:#3ddc97; --loss:#ff7a7a; --dispute:#b9a2ff;
  --tint-l:15%;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f1ed; --bg-2:#eae8e2; --surface:#ffffff; --surface-2:#f6f5f1; --line:#d6d3ca;
    --fg:#14191c; --fg-2:#56636a;
    --accent:#e6a800; --accent-ink:#1a1203; --accent-text:#8a5d00;
    --win:#10794b; --loss:#c23030; --dispute:#5b3fc4;
    --tint-l:91%;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f1ed; --bg-2:#eae8e2; --surface:#ffffff; --surface-2:#f6f5f1; --line:#d6d3ca;
  --fg:#14191c; --fg-2:#56636a;
  --accent:#e6a800; --accent-ink:#1a1203; --accent-text:#8a5d00;
  --win:#10794b; --loss:#c23030; --dispute:#5b3fc4;
  --tint-l:91%;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font:900 28px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.coin{width:1.05em;height:1.05em;flex:none;vertical-align:-.15em}
.coin .c1{fill:var(--accent)}
.coin .c2{fill:none;stroke:var(--accent-ink);stroke-opacity:.5;stroke-width:1.3}
.coin .c3{fill:none;stroke:var(--accent-ink);stroke-width:1.9;stroke-linecap:square}
.nav{display:flex;gap:2px;order:3;width:100%;overflow-x:auto;margin-inline:-6px;padding-inline:6px}
.nav a{padding:8px 12px;text-decoration:none;font:700 13px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2);border-bottom:2px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.bar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.bal{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font:600 15px/1 var(--f-mono)}
.bal small{font:500 12px var(--f-body);color:var(--fg-2)}
@media (min-width:760px){.nav{order:0;width:auto;margin:0}}

/* buttons, forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:1px solid var(--line);background:var(--surface-2);font:700 13px/1.1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;border-radius:3px;text-decoration:none}
.btn:hover{border-color:var(--fg-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:7px 11px;font-size:12px}
.btn.lg{padding:18px 22px;font-size:16px;flex:1 1 200px}
.btn.danger{color:var(--loss)}
.btn.win{border-color:var(--win);color:var(--win)}
.btn[aria-pressed="true"]{background:var(--bg);box-shadow:inset 0 0 0 2px currentColor}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
label{display:block;font:700 12px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--fg-2);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg-2);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
select:disabled{opacity:.5}
textarea{resize:vertical;min-height:70px}
.hint{font-size:13px;color:var(--fg-2);margin-top:6px}
.err{color:var(--loss);font-size:13px;margin-top:10px;min-height:1em}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}

/* sections */
.main{padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}
.eyebrow{font:700 12px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text)}
.hero{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;justify-content:space-between}
.hero h1{font:900 clamp(40px,8vw,72px)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;margin-top:10px}
.hero p.lead{max-width:46ch;color:var(--fg-2);margin-top:12px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-block:1px solid var(--line)}
.strip>div{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.strip>div:first-child{border-left:0;padding-left:0}
.strip b{display:block;font:600 26px/1.1 var(--f-mono)}
.strip span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2)}
.notice{display:flex;gap:12px 20px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface)}
.notice p{max-width:62ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:700 13px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs i{font:500 12px var(--f-mono);font-style:normal;margin-left:6px;color:var(--fg-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:16px}
.empty{padding:36px 16px;border:1px dashed var(--line);text-align:center;color:var(--fg-2)}
.empty b{display:block;color:var(--fg);font:800 24px/1.1 var(--f-display);text-transform:uppercase;margin-bottom:6px}
h2.sec{font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}

/* avatar */
.av{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;background:hsl(var(--h,200) 45% 36%);color:#fff;font:800 20px/1 var(--f-display);letter-spacing:.04em;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));text-transform:uppercase}
.av.xl{width:96px;height:96px;font-size:44px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.av.lg{width:64px;height:64px;font-size:28px}
.av.sm{width:30px;height:30px;font-size:14px;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px))}
.av.empty-av{background:var(--surface-2);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line)}

/* match poster */
.poster{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:3px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.poster:hover{border-color:var(--accent);transform:translateY(-2px)}
.p-top{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.p-top .mode{font:800 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em}
.p-top .bo{font:600 12px var(--f-mono);color:var(--fg-2);border:1px solid var(--line);padding:2px 6px}
.p-top .fmt{font:600 12px var(--f-mono);background:var(--accent);color:var(--accent-ink);padding:3px 6px}
.chip{margin-left:auto;font:700 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border:1px solid currentColor}
.chip.open{color:var(--accent-text)} .chip.live{color:var(--win)} .chip.dispute{color:var(--dispute)} .chip.done{color:var(--fg-2)} .chip.cancelled{color:var(--fg-2);text-decoration:line-through}
.p-face{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:168px;background:linear-gradient(100deg,hsl(var(--ha,200) 38% var(--tint-l)) 0 calc(50% - 1px),var(--line) calc(50% - 1px) calc(50% + 1px),hsl(var(--hb,30) 38% var(--tint-l)) calc(50% + 1px) 100%)}
.p-face.vacant-b{background:linear-gradient(100deg,hsl(var(--ha,200) 38% var(--tint-l)) 0 calc(50% - 1px),var(--line) calc(50% - 1px) calc(50% + 1px),var(--surface-2) calc(50% + 1px) 100%)}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 10px 26px;text-align:center;min-width:0}
.side strong{font:800 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;max-width:100%;overflow-wrap:anywhere}
.side small{font:500 12px var(--f-mono);color:var(--fg-2)}
.side.lose{opacity:.5}
.side .tagw{font:800 11px/1 var(--f-body);letter-spacing:.14em;background:var(--accent);color:var(--accent-ink);padding:4px 7px}
.side .tname{font:700 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.roster{list-style:none;margin:0;padding:0;display:grid;gap:7px;width:100%}
.side.a .roster{padding-right:24px} .side.b .roster{padding-left:24px}
.slot{display:flex;align-items:center;gap:8px;min-width:0;font:700 14px/1.1 var(--f-body);text-align:left}
.slot span.nm{min-width:0;overflow-wrap:anywhere}
.slot i{font:700 10px var(--f-body);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);border:1px solid currentColor;padding:1px 4px}
.slot.free{color:var(--fg-2);font-weight:500}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) skewX(-8deg);background:var(--bg);border:1px solid var(--line);padding:2px 10px;font:900 34px/1.1 var(--f-display);letter-spacing:.04em}
.p-face.team .vs{font-size:26px;padding:2px 8px}
.p-pot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--bg-2);border-top:1px solid var(--line)}
.p-pot span{font:700 11px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2)}
.p-pot b{font:600 22px/1 var(--f-mono);color:var(--accent-text);display:inline-flex;align-items:center;gap:6px}
.p-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);min-height:56px;flex-wrap:wrap}
.p-foot small{color:var(--fg-2);font-size:13px}
.poster.big{cursor:default}
.poster.big:hover{transform:none;border-color:var(--line)}
.poster.big .p-face{min-height:220px}
.poster.big .vs{font-size:46px}
.poster.big .p-face.team .vs{font-size:36px}

/* match page */
.back{align-self:flex-start}
.mhead{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
.mhead h1{font:900 clamp(36px,7vw,60px)/.95 var(--f-display);text-transform:uppercase;margin-top:8px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.tcard{border:1px solid var(--line);background:var(--surface)}
.tcard h3{font:800 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tcard h3 small{font:700 11px var(--f-body);letter-spacing:.12em;color:var(--fg-2)}
.tcard.mine{border-color:var(--accent)}
.tcard ul{list-style:none;margin:0;padding:0}
.tcard li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-width:0}
.tcard li:last-child{border-bottom:0}
.tcard li button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;font:700 16px var(--f-body);min-width:0;overflow-wrap:anywhere}
.tcard li button:hover span.nm{text-decoration:underline}
.tcard li.free{color:var(--fg-2);font-style:italic}
.tcard li i{margin-left:auto;font:700 10px var(--f-body);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);border:1px solid currentColor;padding:2px 5px}
.panel{border:1px solid var(--line);background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:16px}
.panel h2{font:800 26px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.banner{padding:18px 20px;border:2px solid currentColor;font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.banner small{display:block;font:500 14px/1.4 var(--f-body);text-transform:none;letter-spacing:0;color:var(--fg-2);margin-top:6px}
.banner.pos{color:var(--win)} .banner.neg{color:var(--loss)}
dl.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
dl.facts dt{color:var(--fg-2)} dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.help{font-size:13px;color:var(--fg-2)}
.decl{display:grid;gap:6px;font-size:14px}
.decl div{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border:1px solid var(--line);background:var(--bg-2);flex-wrap:wrap}

/* dialog */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,8,10,.72);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{position:relative;width:100%;max-width:460px;margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px}
.dialog h2{font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;padding-right:36px}
.dialog .x{position:absolute;top:8px;right:8px;z-index:2;width:36px;height:36px;background:var(--bg);border:1px solid var(--line);border-radius:3px;font-size:20px;line-height:1}
.pick{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pick button{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;background:var(--bg-2);border:1px solid var(--line);border-radius:3px}
.pick button[aria-current="true"]{border-color:var(--accent)}
.pick span.who{flex:1;min-width:0;overflow-wrap:anywhere}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font:700 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2);text-align:right;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg-2)}
th:nth-child(1),th:nth-child(2){text-align:left}
td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:right;font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
td:nth-child(2){text-align:left;font-family:var(--f-body)}
tr:last-child td{border-bottom:0}
td.rank{font:800 24px/1 var(--f-display);width:56px;text-align:left;color:var(--fg-2)}
tr.top1 td.rank{color:var(--accent-text)}
.who-cell{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;font:700 16px var(--f-body)}
.who-cell:hover span.n{text-decoration:underline}
td.bal-c{color:var(--accent-text);font-weight:600}

/* profile */
.phead{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.phead h1{font:900 clamp(36px,7vw,60px)/.95 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere}
.links{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:8px;color:var(--fg-2);font-size:14px}
.links a{color:var(--fg)}
.phead .actions{margin-left:auto}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));border:1px solid var(--line);background:var(--surface)}
.pstats>div{padding:14px;border-left:1px solid var(--line);min-width:0}
.pstats>div:first-child{border-left:0}
.pstats b{display:block;font:600 22px/1.1 var(--f-mono)}
.pstats span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2)}
.pos{color:var(--win)} .neg{color:var(--loss)}
.hist{list-style:none;margin:0;padding:0;border:1px solid var(--line);background:var(--surface)}
.hist li{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hist li:last-child{border-bottom:0}
.hist .t{flex:1 1 220px;min-width:0}
.hist .t b{display:block;font-weight:700;overflow-wrap:anywhere}
.hist .t small{color:var(--fg-2)}
.hist .amt{font:600 16px var(--f-mono)}
.hist button.t{background:none;border:0;text-align:left;padding:0}
.hist button.t:hover b{text-decoration:underline}

/* rules */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s;border-top:1px solid var(--line)}
.steps li{counter-increment:s;display:grid;grid-template-columns:56px 1fr;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);font:900 44px/1 var(--f-display);color:var(--accent-text)}
.steps b{display:block;font:800 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.steps p{color:var(--fg-2);max-width:62ch}

/* welcome */
.welcome{min-height:100vh;display:grid;gap:32px;align-content:center;padding-block:40px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));max-width:980px}
.welcome h1{font:900 clamp(48px,10vw,92px)/.9 var(--f-display);text-transform:uppercase;margin-top:12px;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px}

/* cadres */
.avf{display:inline-grid;place-items:center;padding:3px;flex:none;clip-path:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,11px 100%,0 calc(100% - 11px));background-size:300% 300%;animation:avfmove 3s linear infinite}
.avf.sm{padding:2px}

@keyframes avfmove{to{background-position:300% 0}}
.avf-neon{background-image:linear-gradient(90deg,#8b5cff,#00d4ff,#ff3fa4,#8b5cff);filter:drop-shadow(0 0 6px rgba(139,92,255,.8))}
.avf-fire{background-image:linear-gradient(0deg,#ff3300,#ff9500,#ffd000,#ff3300);filter:drop-shadow(0 0 8px rgba(255,120,0,.85))}
.avf-lightning{background-image:linear-gradient(45deg,#ffffff,#00e5ff,#2d6bff,#ffffff,#00e5ff);filter:drop-shadow(0 0 8px rgba(0,229,255,.9));animation-duration:1.2s}
.avf-diamond{background-image:linear-gradient(120deg,#e8f7ff,#9ad7ff,#ffffff,#c8b6ff,#e8f7ff);filter:drop-shadow(0 0 8px rgba(200,230,255,.9))}
.avf-winter{background-image:linear-gradient(90deg,#ffffff,#bfe9ff,#7cc8ff,#ffffff);filter:drop-shadow(0 0 8px rgba(160,220,255,.9))}
/* effets de pseudo */
.fx-sparkle{animation:sparkle 1.6s ease-in-out infinite}
@keyframes sparkle{0%,100%{filter:brightness(1) drop-shadow(0 0 0 #fff)}50%{filter:brightness(1.6) drop-shadow(0 0 6px #fff)}}
.fx-wave{display:inline-block;animation:wave 2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0) skewX(0)}25%{transform:translateY(-2px) skewX(-4deg)}75%{transform:translateY(2px) skewX(4deg)}}
.fx-glitch{position:relative;display:inline-block}
.fx-glitch::before,.fx-glitch::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden}
.fx-glitch::before{color:#ff3fa4;-webkit-text-fill-color:#ff3fa4;animation:gl1 2.2s infinite steps(2);clip-path:inset(0 0 55% 0)}
.fx-glitch::after{color:#00d4ff;-webkit-text-fill-color:#00d4ff;animation:gl2 1.9s infinite steps(2);clip-path:inset(55% 0 0 0)}
@keyframes gl1{0%,88%,100%{transform:none;opacity:0}90%{transform:translate(-2px,-1px);opacity:.9}94%{transform:translate(2px,1px);opacity:.9}}
@keyframes gl2{0%,85%,100%{transform:none;opacity:0}87%{transform:translate(2px,0);opacity:.9}92%{transform:translate(-2px,1px);opacity:.9}}
/* bannières */

.bn-matrix{background-image:repeating-linear-gradient(90deg,rgba(0,255,120,.12) 0 2px,transparent 2px 14px),linear-gradient(180deg,#001a0a,#003d1a,#001a0a)}

/* thèmes d'affiche */
.side.pt-lava{background:linear-gradient(160deg,rgba(255,60,0,.55),rgba(120,0,0,.65))}
.side.pt-ice{background:linear-gradient(160deg,rgba(180,240,255,.45),rgba(30,90,180,.6))}
.side.pt-galaxy{background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.3) 0 1px,transparent 2px),linear-gradient(160deg,rgba(80,30,160,.7),rgba(10,40,110,.7))}

/* animation de victoire */
.win-fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}

/* collab ORIONG Esport : barre qui se rétracte à gauche puis ressort */
.cfl{position:fixed;left:0;top:50%;width:340px;height:60px;margin-top:-30px;z-index:20;pointer-events:none}
.cfl>*{pointer-events:auto}
.cfl-handle{position:absolute;left:0;top:0;bottom:0;width:14px;z-index:3;border-radius:0 14px 14px 0;background:linear-gradient(90deg,#1a1140 0 5px,#9b7bff 5px);box-shadow:0 6px 18px rgba(40,30,150,.5);cursor:pointer}
.cfl-face{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 16px 0 22px;color:#fff;overflow:hidden;border-radius:0 30px 30px 0;border:1px solid rgba(190,200,255,.5);border-left:0;background:linear-gradient(90deg,#9b7bff 0%,#7457e6 45%,#4a35b8 100%);box-shadow:0 8px 24px rgba(40,30,150,.5)}
.cfl-face::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#1a1140}
.cfl-face::after{content:'';position:absolute;top:-10%;bottom:-10%;left:-50%;width:34%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);pointer-events:none}
.cfl-a,.cfl-b{transition:transform .55s cubic-bezier(.6,0,.9,.4),visibility 0s .55s;transform:translateX(-100%);visibility:hidden}
.cfl.s-a .cfl-a,.cfl.s-b .cfl-b{transform:translateX(0);visibility:visible;transition:transform .8s cubic-bezier(.2,.9,.25,1.12) .6s,visibility 0s .6s}
.cfl.s-a .cfl-a::after{left:130%;transition:left .9s ease 1.5s}
.cfl.s-b .cfl-b::after{left:130%;transition:left .9s ease 1.5s}
.cfl-logo{position:relative;flex:0 0 auto;width:40px;height:40px;border-radius:50%;overflow:hidden;animation:cflGlow 3.2s ease-in-out infinite}
@keyframes cflGlow{0%,100%{box-shadow:0 0 10px rgba(200,210,255,.55)}50%{box-shadow:0 0 20px rgba(230,236,255,.95)}}
.cfl-logo img,.cfl-logo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.cfl-t{display:flex;flex-direction:column;line-height:1.1;min-width:0}

.cfl-b .cfl-w{display:inline-block;clip-path:inset(0 100% 0 0)}
.cfl-b .cfl-t small{opacity:0}
.cfl.s-b .cfl-b .cfl-w{clip-path:inset(0 0 0 0);transition:clip-path .7s steps(13) 1.3s}
.cfl.s-b .cfl-b .cfl-t small{opacity:1;transition:opacity .4s ease 1.1s}
.cfl-b a{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 9px;border-radius:999px;color:#fff;text-decoration:none;font:700 12px var(--f-body);background:rgba(10,6,40,.4);border:1px solid rgba(255,255,255,.34);opacity:0;transform:scale(.6);transition:background .15s}
.cfl.s-b .cfl-b a{opacity:1;transform:scale(1);transition:opacity .35s ease 2.1s,transform .45s cubic-bezier(.3,1.5,.5,1) 2.1s,background .15s}
.cfl.s-b .cfl-b a+a{transition-delay:2.3s,2.3s,0s}

@media (max-width:1799px){.cfl{width:56px;height:72px;margin-top:-36px}.cfl-face{padding:0 0 0 10px;justify-content:center;gap:6px;border-radius:0 28px 28px 0}.cfl-t,.cfl-new,.cfl-b a span{display:none}.cfl-b{flex-direction:column}.cfl-b a{width:32px;height:32px;padding:0;justify-content:center}.cfl-handle{width:12px}}

@keyframes ogConf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}

.pp-rule{padding:10px 14px;border-radius:12px;border:1px solid rgba(255,201,60,.5);background:rgba(255,201,60,.08);margin-bottom:10px}
.cust-teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.cust-team{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}

.tp-wrap{display:inline-flex;align-items:center;gap:4px}

.chat-list{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px;background:rgba(7,8,26,.5);border:1px solid var(--line);border-radius:12px}
.msg{display:flex;gap:10px;align-items:flex-start;min-width:0}
.msg.mine{flex-direction:row-reverse}
.msg .bub{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-width:min(80%,520px);min-width:0}
.msg.mine .bub{background:rgba(139,92,255,.22);border-color:rgba(139,92,255,.5)}
.msg .bub b{display:block;font-size:12px;color:var(--accent-2);margin-bottom:2px}
.msg .bub b small{color:var(--fg-2);font-weight:500;margin-left:4px}
.msg .bub span{overflow-wrap:anywhere;white-space:pre-wrap}
.chat-form{display:flex;gap:8px}
